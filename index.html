<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學遊戲選單</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background-color: #fcfcfc; /* 搭配馬卡龍色的柔和微灰白背景 */
            margin: 0;
        }
        h1 { color: #555; margin-bottom: 30px; letter-spacing: 2px; }
        
        /* 分類手風琴面板設計 */
        details {
            max-width: 1000px;
            margin: 0 auto 20px auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            overflow: hidden;
            text-align: left;
            border: 1px solid #eee;
        }
        
        /* 分類標題按鈕 */
        summary {
            font-size: 20px;
            font-weight: bold;
            color: #444; /* 深灰色字體，閱讀舒適 */
            padding: 18px 20px;
            cursor: pointer;
            list-style: none;
            position: relative;
            transition: background-color 0.2s;
        }

        /* 自訂展開箭頭 */
        summary::after {
            content: '▼';
            position: absolute;
            right: 20px;
            color: #666;
            transition: transform 0.3s;
        }
        details[open] summary::after {
            transform: rotate(180deg);
        }

        /* 展開後的內容區塊 */
        .category-content {
            padding: 25px;
            background-color: white;
        }

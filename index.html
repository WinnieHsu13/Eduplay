<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學遊戲選單</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background-color: #f7f9fc; 
            margin: 0;
        }
        h1 { color: #333; margin-bottom: 30px; }
        
        /* 分類手風琴面板設計 */
        details {
            max-width: 1000px;
            margin: 0 auto 20px auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            text-align: left;
        }
        
        /* 分類標題按鈕 */
        summary {
            font-size: 20px;
            font-weight: bold;
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            cursor: pointer;
            list-style: none;
            position: relative;
            transition: background-color 0.2s;
        }
        
        summary:hover {
            background-color: #34495e;
        }

        /* 自訂展開箭頭 */
        summary::after {
            content: '▼';
            position: absolute;
            right: 20px;
            transition: transform 0.3s;
        }
        details[open] summary::after {
            transform: rotate(180deg);
        }

        /* 展開後的內容區塊 */
        .category-content {
            padding: 25px;
        }

        /* 4 欄網格設計 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        
        /* 正方形卡片外觀 */
        .game-card {
            background-color: #4CAF50; 
            border-radius: 15px;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.4;
            text-align: center;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            background-color: #45a049;
        }

        /* 手機與平板尺寸自動調整 */
        @media (max-width: 900px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .game-card { font-size: 18px; }
        }
    </style>
</head>
<body>

    <h1>請選擇遊戲類別</h1>

    <!-- 教育科分類 -->
    <details open> <!-- 加上 open 預設會展開，若不想預設展開請刪除 open -->
        <summary>教育科</summary>
        <div class="category-content">
            <div class="grid-container">
                <a href="richman1.html" class="game-card">Richman-1</a>
                <a href="richman2.html" class="game-card">Richman-2</a>
                <a href="richman3.html" class="game-card">Richman-3</a>
                <a href="rpg.html" class="game-card">RPG</a>     
            </div>
        </div>
    </details>

    <!-- 統計科分類 -->
    <details>
        <summary>統計科</summary>
        <div class="category-content">
            <div class="grid-container">
                <a href="school1.html" class="game-card">Media-1</a>        
                <a href="school2.html" class="game-card">Media-2</a>        
                <a href="school3.html" class="game-card">Media-3</a> 
            </div>
        </div>
    </details>

    <!-- 數學科分類 -->
    <details>
        <summary>數學科</summary>
        <div class="category-content">
            <div class="grid-container">
                <a href="math1.html" class="game-card">Math-1</a>       
                <a href="math2.html" class="game-card">Math-2</a>
                <a href="math3.html" class="game-card">Math-3</a>
            </div>
        </div>
    </details>

    <!-- 永續發展分類 -->
    <details>
        <summary>永續發展 (SDGs)</summary>
        <div class="category-content">
            <div class="grid-container">
                <a href="SDGs-1.html" class="game-card">SDGs-1</a>
                <a href="SDGs-2.html" class="game-card">SDGs-2</a>
                <a href="SDGs-3.html" class="game-card">SDGs-3</a>
            </div>
        </div>
    </details>

    <!-- 其他專題分類 -->
    <details>
        <summary>專題與其他</summary>
        <div class="category-content">
            <div class="grid-container">
                <a href="IR-1.html" class="game-card">IR-1</a>
                <a href="IR-2.html" class="game-card">IR-2</a>
                <a href="#" class="game-card" style="background-color: #9e9e9e;">更多遊戲<br>(建置中)</a>
            </div>
        </div>
    </details>

</body>
</html>
